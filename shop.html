<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - Bloom & Co.</title>
  <link rel="stylesheet" href="style.css" />
  <script src="./variables.js"></script>
</head>

<body>
  <header>
    <div class="logo">Bloom & Co.</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="customer-profile.html">Profile</a>
      <a href="customer-carts.html">My Carts</a>
      <a href="shop.html">Shop</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <div class="form-container">
    <h2 id="shopWelcomeTitle">Shop Our Products</h2>

    <div id="shopProductList" style="margin-top: 2rem;">
      <!-- Products will load here -->
       <div class="list" id="list">
          
       </div>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async() => {
      const user = localStorage.getItem('token');
      if (!user) {
        window.location.href = "customer-login.html";
        return;
      }

      const welcomeTitle = document.getElementById('shopWelcomeTitle');
      welcomeTitle.innerHTML = `Welcome back, ${user.name}! Happy Shopping ✨`;
      const list = document.getElementById("list");
      console.log(list);
      const response = await fetch(`${url}product`, {
        headers: {
          "Authorization": `Bearer ${localStorage.getItem('token')}`
        }
      });
      const parsed = await response.json();
      console.log(parsed[0]);
      for(itemValue in parsed){
        const item = parsed[itemValue];
        console.log(item);
        list.innerHTML += `
          <div class="list-item">
            <div class="item-text">
              <h3>${item.Product_Name}</h3>
              <p>${item.Description}</p>
              <p class="bold">$${item.Price}</p>
            </div>
            <button onClick="addToCart(${item.Product_ID})">Add to cart</button>
          </div>
        `;
      }
    });
    
    function logout() {
      localStorage.removeItem('token');
      window.location.href = "index.html";
    }
  </script>
  <style>
    .list-item{
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      background-color: #f7f7f7;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .item-text{
      width: 70%;
      background: none;
    }
    .list-item>button{
      height: fit-content;
    }
    .bold{
      font-weight: bold;
    }
  </style>
</body>
</html>
