<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Products - Bloom & Co.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Bloom & Co.</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="seller-dashboard.html">Dashboard</a>
      <a href="seller-products.html">My Products</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <div class="form-container">
    <h2>My Products</h2>

    <input type="text" id="productName" placeholder="Product Name">
    <input type="text" id="productCategory" placeholder="Category">
    <textarea id="productDescription" placeholder="Description" style="width: 100%; height: 100px; margin-top: 0.5rem; padding: 0.75rem;"></textarea>
    <input type="number" id="productPrice" placeholder="Price">
    <input type="number" id="productStock" placeholder="Stock Quantity">
    <input type="text" id="productImage" placeholder="Image URL">
    <button onclick="addProduct()">Add Product</button>

    <h3 style="margin-top:2rem;">Your Listed Products</h3>
    <div id="productList">
      <!-- Products will be listed here -->
    </div>

    <a href="seller-dashboard.html" class="back-link">← Back to Dashboard</a>
  </div>

  <script src="script.js"></script>
  <input type="text" id="productImage" placeholder="Product Image URL">

</body>
</html>
